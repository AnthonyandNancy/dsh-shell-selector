name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify committed lib matches src
        # `lib/` is committed: a git-hosted install must find `lib/index.js`
        # without running `prepack` (pnpm 11 blocks that build script). A stale
        # committed artifact is therefore shipped as-is, so the rebuild above
        # must reproduce it byte for byte. One platform is enough — it also
        # proves the artifact does not depend on the machine that built it.
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- lib cordis.patch.yml

      - name: Pack (dry-run)
        run: npm pack --dry-run
